name: MeshTalk
options:
  bundleIdPrefix: com.meshtalk
  deploymentTarget:
    iOS: "16.0"
configs:
  Debug: debug
  Release: release
targets:
  MeshTalk:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: MeshTalk
      - path: ../bindings/swift/mesh_mobile.swift
        group: Generated
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meshtalk.app
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SDKROOT: iphoneos
        ENABLE_BITCODE: NO
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_ON_DEMAND_RESOURCES: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: meshtalk
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "meshtalk relays chat messages between nearby devices over your local Wi-Fi network."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "meshtalk needs microphone access to record voice notes and voice/video calls."
        INFOPLIST_KEY_NSCameraUsageDescription: "meshtalk needs camera access for video calls."
    dependencies:
      - framework: Frameworks/mesh_mobileFFI.xcframework
        embed: false
